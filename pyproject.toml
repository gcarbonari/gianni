[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plc-monitor"
version = "0.1.0"
description = "Lettura e grafico di segnali PLC via Modbus TCP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymodbus==3.11.4",
    "matplotlib>=3.8",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
plc-monitor = "plc_monitor.cli:main"

[tool.setuptools.packages.find]
include = ["plc_monitor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
