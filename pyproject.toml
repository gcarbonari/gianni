[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plc-monitor"
version = "0.1.0"
description = "Data center: moduli CAN/J1939, ARINC 429 e PLC verso client HMI"

readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymodbus==3.11.4",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
plc-monitor = "plc_monitor.cli:main"
data-center = "data_center.cli:main"

[tool.setuptools.packages.find]
include = ["plc_monitor*", "data_center*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
