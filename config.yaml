# PLC reale — Modbus TCP.
# Metti qui l'IP del tuo PLC, poi:  python -m plc_monitor test
# Grafico live:                     python -m plc_monitor plot
#
# Indirizzi 0-based (holding 0 = 40001 su molti PLC).
# Adatta name / table / address / dtype a come hai mappato i dati sul PLC.

plc:
  host: 192.168.1.10
  port: 502
  unit_id: 1
  timeout: 2.0
  poll_ms: 200

plot:
  title: Segnali PLC
  window_seconds: 30

csv:
  enabled: false
  path: segnali.csv

signals:
  - name: Temperatura
    table: holding
    address: 0
    dtype: float32
    word_order: abcd
    scale: 1.0
    offset: 0.0
    unit: "°C"

  - name: Pressione
    table: holding
    address: 2
    dtype: float32
    word_order: abcd
    scale: 1.0
    offset: 0.0
    unit: bar

  - name: Velocita
    table: holding
    address: 4
    dtype: uint16
    scale: 1.0
    offset: 0.0
    unit: rpm

  - name: Allarme
    table: coil
    address: 0
    dtype: bool
    unit: ""
